options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: asia-east1
  _SERVICE: telegram-translator-bot
  _TAG: latest
  _TELEGRAM_BOT_TOKEN_SECRET: telegram-bot-token
  _TELEGRAM_WEBHOOK_SECRET_NAME: ''
  _XAI_API_KEY_SECRET: ''
  _GEMINI_API_KEY_SECRET: ''
  _GEMINI_LIVE_TRANSLATE: '0'
  _TELEGRAM_VOICE_SUB_STARS: '0'
  _SERVICE_ACCOUNT: user-704@line-trnsltrbt.iam.gserviceaccount.com
  _APP_VERSION: unknown

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--platform=linux/amd64"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/line-trnsltrbt/${_SERVICE}:${_TAG}"
      - "-f"
      - "Dockerfile.telegram"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/line-trnsltrbt/${_SERVICE}:${_TAG}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - -c
      - |
        SECRETS="TELEGRAM_BOT_TOKEN=${_TELEGRAM_BOT_TOKEN_SECRET}:latest"
        if [ -n "${_TELEGRAM_WEBHOOK_SECRET_NAME}" ]; then
          SECRETS="$${SECRETS},TELEGRAM_WEBHOOK_SECRET=${_TELEGRAM_WEBHOOK_SECRET_NAME}:latest"
        fi
        if [ -n "${_XAI_API_KEY_SECRET}" ]; then
          SECRETS="$${SECRETS},XAI_API_KEY=${_XAI_API_KEY_SECRET}:latest"
        fi
        if [ -n "${_GEMINI_API_KEY_SECRET}" ]; then
          SECRETS="$${SECRETS},GEMINI_API_KEY=${_GEMINI_API_KEY_SECRET}:latest"
        fi
        ENV_VARS="APP_VERSION=${_APP_VERSION},TELEGRAM_VOICE_SUB_STARS=${_TELEGRAM_VOICE_SUB_STARS},GEMINI_LIVE_TRANSLATE=${_GEMINI_LIVE_TRANSLATE}"
        gcloud run deploy "${_SERVICE}" \
          --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/line-trnsltrbt/${_SERVICE}:${_TAG}" \
          --region "${_REGION}" \
          --allow-unauthenticated \
          --port 8080 \
          --memory 2Gi \
          --cpu 2 \
          --min-instances 0 \
          --max-instances 10 \
          --set-secrets "$${SECRETS}" \
          --set-env-vars "$${ENV_VARS}" \
          --service-account "${_SERVICE_ACCOUNT}"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/line-trnsltrbt/${_SERVICE}:${_TAG}"
